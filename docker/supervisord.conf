[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:php]
command=/usr/bin/php -S 0.0.0.0:8080 -t /app /app/backend/public/index.php
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ocr]
command=/opt/ocr-venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8002
directory=/app/ocr
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
